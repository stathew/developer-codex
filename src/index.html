<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Developer Codex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Developer Codex — an encyclopedia for full-stack developers to learn, and retain, the fundamentals in the age of AI.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('developer-codex.theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
