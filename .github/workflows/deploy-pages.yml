# Builds the codex and publishes it to GitHub Pages on every push to master.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Site is served from https://<user>.github.io/<repo>/
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages has no SPA fallback: serve the app for unknown paths so deep links work.
      - run: cp dist/developer-codex/browser/index.html dist/developer-codex/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/developer-codex/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
